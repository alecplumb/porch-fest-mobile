name: Android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - shared/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - shared/**
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android.yml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Android: build, test, lint"
    # Pushes and pull requests from branches in this repository run on our own Mac.
    # Pull requests from forks contain code we have not reviewed, so they never touch that
    # machine: they run on a GitHub-hosted runner instead. See docs/ci-runner.md.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit test and lint the debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Compile the release build
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-*.html
