name: iOS

on:
  push:
    branches: [main]
    paths:
      - ios/**
      - shared/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - ios/**
      - shared/**
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios.yml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pushes and pull requests from branches in this repository run on our own Mac.
    # Pull requests from forks contain code we have not reviewed, so they never touch that
    # machine: they run on a GitHub-hosted runner instead. See docs/ci-runner.md.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install xcodegen if missing
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # The scheme's build phase runs shared's Gradle build to produce the Kotlin framework.
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project PorchFest.xcodeproj \
            -scheme "PorchFest Local" \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
