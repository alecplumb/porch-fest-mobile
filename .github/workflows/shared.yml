name: Shared

on:
  push:
    branches: [main]
    paths:
      - shared/**
      - .github/workflows/shared.yml
  pull_request:
    paths:
      - shared/**
      - .github/workflows/shared.yml
  workflow_dispatch:

concurrency:
  group: shared.yml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Pushes and pull requests from branches in this repository run on our own Mac.
    # Pull requests from forks contain code we have not reviewed, so they never touch that
    # machine: they run on a GitHub-hosted runner instead. See docs/ci-runner.md.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test on Android host and iOS simulator, lint
        working-directory: shared
        run: ./gradlew check
