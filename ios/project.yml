# Xcode project definition. The .xcodeproj is generated and not committed:
#   cd ios && xcodegen generate
name: PorchFest
options:
  bundleIdPrefix: org.towerporchfest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Debug builds talk to the local backend; Release builds talk to production. Switching
# environment inside a debug build will live in the app's Debug Settings screen.
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The shared Kotlin framework is built for Apple silicon simulators only (iosSimulatorArm64),
    # so never ask for an Intel simulator slice. Release builds would otherwise request one.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  # Used only inside PorchFest/Map/MapLibre; the rest of the app talks to FestivalMapView.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0

targets:
  PorchFest:
    type: application
    platform: iOS
    sources:
      - PorchFest
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_NAME: PorchFest
        PRODUCT_BUNDLE_IDENTIFIER: org.towerporchfest.app$(PF_BUNDLE_ID_SUFFIX)
        INFOPLIST_FILE: $(PF_INFOPLIST)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The shared Kotlin framework is static: built by the script phase below, then linked here.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared -lsqlite3
        # The script phase runs Gradle, which reads and writes outside Xcode's sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: '"$SRCROOT/scripts/build-shared-framework.sh"'
        basedOnDependencyAnalysis: false

  PorchFestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PorchFestTests
    dependencies:
      - target: PorchFest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.towerporchfest.app.tests
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

schemes:
  PorchFest:
    build:
      targets:
        PorchFest: all
        PorchFestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PorchFestTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
