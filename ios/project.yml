# Xcode project definition. The .xcodeproj is generated and not committed:
#   cd ios && xcodegen generate
name: PorchFest
options:
  bundleIdPrefix: org.towerporchfest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# One build configuration per environment. Names have no spaces because they become
# directory names in the shared framework's output path.
configs:
  Debug-Local: debug
  Debug-Prod: debug
  Release-Prod: release
configFiles:
  Debug-Local: Config/Local.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # Tells the Kotlin Gradle plugin which framework variant to build for each configuration.
    Debug-Local:
      KOTLIN_FRAMEWORK_BUILD_TYPE: debug
    Debug-Prod:
      KOTLIN_FRAMEWORK_BUILD_TYPE: debug
    Release-Prod:
      KOTLIN_FRAMEWORK_BUILD_TYPE: release

packages:
  # Used only inside PorchFest/Map/MapLibre; the rest of the app talks to FestivalMapView.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0

targets:
  PorchFest:
    type: application
    platform: iOS
    sources:
      - PorchFest
    dependencies:
      - package: MapLibre
    settings:
      base:
        PRODUCT_NAME: PorchFest
        PRODUCT_BUNDLE_IDENTIFIER: org.towerporchfest.app$(PF_BUNDLE_ID_SUFFIX)
        INFOPLIST_FILE: $(PF_INFOPLIST)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # The shared Kotlin framework is static: built by the script phase below, then linked here.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared -lsqlite3
        # The script phase runs Gradle, which reads and writes outside Xcode's sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: '"$SRCROOT/scripts/build-shared-framework.sh"'
        basedOnDependencyAnalysis: false

  PorchFestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PorchFestTests
    dependencies:
      - target: PorchFest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: org.towerporchfest.app.tests
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

schemes:
  PorchFest Local:
    build:
      targets:
        PorchFest: all
        PorchFestTests: [test]
    run:
      config: Debug-Local
    test:
      config: Debug-Local
      targets: [PorchFestTests]
    profile:
      config: Debug-Local
    analyze:
      config: Debug-Local
    archive:
      config: Debug-Local
  PorchFest Prod:
    build:
      targets:
        PorchFest: all
    run:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
